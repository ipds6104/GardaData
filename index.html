<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Garda Data</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f19; font-family: system-ui, -apple-system, sans-serif; color: #94a3b8;">
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 20px;">
          <img src="/logo.png" alt="Garda Data" style="width: 100%; height: 100%; object-fit: contain; animation: gardaPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;" onerror="this.style.display='none'" />
        </div>
        <div style="font-size: 16px; font-weight: 700; color: #f8fafc; letter-spacing: 0.05em; margin-bottom: 6px;">
          GARDA DATA
        </div>
        <div style="font-size: 13px; color: #64748b;">Memuat aplikasi...</div>
      </div>
      <style>
        @keyframes gardaPulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.5; transform: scale(0.95); }
        }
      </style>
    </div>
    <script>
      // Tangani transisi deployment baru jika chunk hash lama tidak ditemukan di server
      window.addEventListener('vite:preloadError', (event) => {
        console.warn('[Vite] Preload error terdeteksi. Memuat ulang aplikasi...', event);
        window.location.reload();
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
